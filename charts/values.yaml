movie:
  replicas: 1
  image:
    repository: vvitovt/jenkins-exam-movie
    tag: manual-test
cast:
  replicas: 1
  image:
    repository: vvitovt/jenkins-exam-cast
    tag: manual-test
postgres:
  image: postgres:12.1-alpine
