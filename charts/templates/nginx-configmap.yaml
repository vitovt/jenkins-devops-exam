apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 8080;
      location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
      location /api/v1/movies {
        proxy_pass http://movie-service:8000;
      }
      location /api/v1/casts {
        proxy_pass http://cast-service:8000;
      }
    }
