apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  movie-db-password: {{ .Values.postgres.movie.password | quote }}
  cast-db-password: {{ .Values.postgres.cast.password | quote }}
  movie-database-uri: {{ printf "postgresql://%s:%s@movie-db/%s" .Values.postgres.movie.user .Values.postgres.movie.password .Values.postgres.movie.database | quote }}
  cast-database-uri: {{ printf "postgresql://%s:%s@cast-db/%s" .Values.postgres.cast.user .Values.postgres.cast.password .Values.postgres.cast.database | quote }}
