{{- range $name := list "movie" "cast" }}
{{- $app := index $.Values $name }}
{{- $db := index $.Values.postgres $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ $.Values.postgres.image | quote }}
          command: ["sh", "-ec"]
          args:
            - until pg_isready -h {{ $name }}-db -U {{ $db.user }} -d {{ $db.database }}; do sleep 2; done
      containers:
        - name: {{ $name }}-service
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: {{ $name }}-database-uri
            {{- if eq $name "movie" }}
            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}-service
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
