apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-smoke-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sh", "-ec"]
      args:
        - >-
          curl -fsS --retry 20 --retry-delay 3 --retry-connrefused -o /dev/null http://gateway:8080/api/v1/movies/docs &&
          curl -fsS --retry 20 --retry-delay 3 --retry-connrefused -o /dev/null http://gateway:8080/api/v1/casts/docs
